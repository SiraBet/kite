<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" role="img" aria-label="kite">
  <!-- The kite mark: a pounamu pikorua, two paths that cross and always meet again; the lower loop
       is hatched for the hosts not yet confirmed. Primary colours, for dark grounds (#101619). -->
  <defs><pattern id="h" width="1.4" height="1.4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="0.55" height="1.4" fill="#3FA07D"/></pattern></defs>
  <path d="M12 12C19 19 19 22.2 12 22.2C5 22.2 5 19 12 12Z" fill="url(#h)"/>
  <path d="M12 12C5 5 5 1.8 12 1.8C19 1.8 19 5 12 12C5 19 5 22.2 12 22.2C19 22.2 19 19 12 12" fill="none" stroke="#3FA07D" stroke-width="3.4" stroke-linecap="round"/>
  <path d="M12 12C5 5 5 1.8 12 1.8C19 1.8 19 5 12 12C5 19 5 22.2 12 22.2C19 22.2 19 19 12 12" fill="none" stroke="#9BD8BC" stroke-width="0.9" stroke-linecap="round" transform="translate(-.55 -.55)" opacity=".85"/>
  <path d="M10.3 10.3L13.7 13.7" stroke="#101619" stroke-width="5.2"/>
  <path d="M9.9 9.9L14.1 14.1" stroke="#3FA07D" stroke-width="3.4"/>
  <path d="M9.9 9.9L14.1 14.1" stroke="#9BD8BC" stroke-width="0.9" transform="translate(-.55 -.55)" opacity=".85"/>
</svg>

# Alembic config for kite-controller.
#
# You normally never run alembic by hand: app/db.py runs `upgrade head`
# automatically on every startup, so `git pull && restart` (or
# `docker compose up -d --build`) is the whole upgrade procedure. This
# file exists so the alembic CLI works for the one thing it IS needed
# for — authoring a new revision:
#
#   cd controller && alembic revision -m "add whatever_column"
#
# sqlalchemy.url is intentionally left blank: migrations/env.py takes the
# URL from app.db's engine so there is exactly one place the database
# location is decided (KITE_DB), and no chance of the CLI migrating a
# different file than the app uses.

[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
